# Visit https://github.com/lowlighter/metrics for full reference
name: Update Metrics Readme - [Skip GitHub Action]

on:
  schedule: # 定时运行
    - cron: "0 0 * * *" # 每天运行一次
  # 手动触发
  workflow_dispatch:
  # 仅在推送到dev分支时触发
  push:
    branches:
      - dev

jobs:
  github-metrics:
    name: Update Readme with Metrics - [Skip GitHub Action]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Setup metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GH_TOKEN }} # 使用 GitHub Token
          # Options
          template: classic
          # base: header, activity, community, repositories
          base: activity, community, repositories
          base_indepth: yes
          config_octicon: yes
          config_timezone: Asia/Shanghai
          config_twemoji: yes
          repositories_batch: 100
          repositories_forks: yes
          users_ignored: ""
          # Plugins错误处理
          plugins_errors_fatal: yes
          # 提交图
          plugin_calendar: yes
          plugin_calendar_limit: 1
          # 常用语言
          plugin_languages: yes
          plugin_languages_colors: github
          plugin_languages_limit: 6
          plugin_languages_sections: most-used
          plugin_languages_threshold: 5%
          plugin_languages_ignored: >-
            html, css
          plugin_languages_details: bytes-size, percentage
          # RSS订阅
          plugin_rss: yes
          plugin_rss_limit: 5
          plugin_rss_source: https://blog.keaikeqing.cn/rss.xml
          # 收藏主题
          plugin_topics: yes
          plugin_topics_limit: 10
          plugin_topics_mode: icons
          plugin_topics_sort: stars
          # 文件位置
          filename: assets/github-metrics.svg
